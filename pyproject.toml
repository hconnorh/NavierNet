[project]
name = "ns2d-surrogate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "h5py>=3.15.0",
    "imageio[ffmpeg]>=2.37.0",
    "meshio>=5.3.5",
    "nbformat>=5.10.4",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "pyarrow>=21.0.0",
    "pyfr>=2.1",
    "pyobjc-core>=11.1",
    "pyobjc-framework-metal>=11.1",
    "pyvista>=0.46.3",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "plotly>=6.3.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
