[backend]
precision = single

[constants]
nu = 0.005       # kinematic viscosity
Uin = 1.0        # inlet velocity (x)
Vin = 0.0        # inlet velocity (y)
Pc = 1.0         # reference pressure
ac-zeta = 2.5    # artificial compressibility parameter

[solver]
system = ac-navier-stokes
order = 3

[solver-time-integrator]
formulation = dual
scheme = sdirk33
pseudo-scheme = rk45
controller = none
pseudo-controller = local-pi
tstart = 0.0
tend = 75.0                     # Time end
dt = 0.01                       # Time step, reduce for high Re
pseudo-dt = 0.001               # Smaller pseudo step for stability
pseudo-niters-min = 10          # More inner iterations for convergence
pseudo-niters-max = 20
pseudo-resid-norm = l2
pseudo-resid-tol = 1e-12
atol = 1e-6
pseudo-dt-max-mult = 2.5

[solver-dual-time-integrator-multip]
pseudo-dt-fact = 1.75
cycle = [(3, 1), (2, 1), (1, 1), (0, 2), (1, 1), (2, 1), (3, 4)]

[solver-interfaces]
riemann-solver = rusanov
ldg-beta = 0.5
ldg-tau = 0.1

[solver-interfaces-line]
flux-pts = gauss-legendre

[solver-elements-tri]
soln-pts = williams-shunn

[solver-elements-quad]
soln-pts = gauss-legendre

[soln-plugin-nancheck]
nsteps = 50

[soln-plugin-pseudostats]
flushsteps = 20
file = residual.csv
header = true

[soln-plugin-writer]
dt-out = 5.0
basedir = .
basename = inc-cylinder-{t:.2f}

[soln-bcs-wall]
type = no-slp-wall

[soln-bcs-inlet]
type = ac-char-riem-inv
ac-zeta = 180
p = Pc
u = Uin
v = Vin

[soln-bcs-outlet]
type = ac-out-fp
p = Pc

[soln-ics]
u = Uin
v = Vin
p = Pc
